<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tri & Seconde Vie — L'Oasis du Réemploi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080d09;font-family:'Nunito',sans-serif;color:#E8F5E9;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow-x:hidden}
#game{width:100%;max-width:860px;min-height:640px;background:linear-gradient(180deg,#0F1A12,#1A2B1F 50%,#0D1710);border-radius:20px;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(16,185,129,0.1)}

/* LANG */
.lang-bar{position:absolute;top:10px;right:14px;z-index:300;display:flex;gap:6px}
.lang-btn{background:rgba(15,26,18,0.95);border:1px solid rgba(255,255,255,0.15);color:#C8E6C9;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;position:relative;z-index:301}
.lang-btn:hover{background:rgba(255,255,255,0.15)}
.lang-btn.active{background:#10B981;color:#fff;border-color:#10B981}

/* SCREENS */
.scr{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:640px;padding:28px 20px;text-align:center;gap:14px}
.brand-line{font-size:11px;color:#81C784;letter-spacing:3px;text-transform:uppercase;opacity:.8}
.brand-name{font-size:13px;color:#4ADE80;font-weight:800;letter-spacing:1px}
.big-emoji{font-size:56px}
.title{font-size:28px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#4ADE80,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:12px;color:#81C784;letter-spacing:3px;text-transform:uppercase}
.rules-box{background:rgba(255,255,255,.05);border-radius:14px;padding:12px 16px;max-width:520px;text-align:left;display:flex;flex-direction:column;gap:8px}
.rule-item{font-size:12px;color:#C8E6C9;line-height:1.4}
.tag{display:inline-block;color:#fff;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;margin-right:4px;letter-spacing:1px}
.tag-g{background:#10B981}.tag-p{background:#6366F1}.tag-o{background:#F59E0B}

/* NAME+AGE */
.name-input{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);color:#E8F5E9;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;text-align:center;width:240px;outline:none;transition:border-color .2s}
.name-input:focus{border-color:#4ADE80}
.name-input::placeholder{color:rgba(200,230,201,.35)}
.age-label{font-size:12px;color:#A5D6A7;font-weight:700}
.age-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.age-btn{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);color:#C8E6C9;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;min-width:90px}
.age-btn:hover{border-color:#4ADE80;color:#4ADE80}
.age-btn.sel{background:rgba(16,185,129,.2);border-color:#10B981;color:#6EE7B7}

/* BUTTONS */
.btn{color:#fff;border:none;padding:12px 44px;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:2px;font-family:inherit;transition:transform .15s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-green{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 4px 28px rgba(16,185,129,.35)}
.btn-purple{background:linear-gradient(135deg,#6366F1,#4F46E5);box-shadow:0 4px 24px rgba(99,102,241,.35)}
.btn-orange{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 4px 24px rgba(245,158,11,.35)}
.btn-sm{padding:8px 24px;font-size:13px;letter-spacing:1px}
.btn-outline{background:transparent;border:2px solid #4ADE80;color:#4ADE80;padding:8px 24px;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-outline:hover{background:rgba(74,222,128,.1)}

.final-num{font-size:58px;font-weight:900;background:linear-gradient(135deg,#F5C518,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.final-lbl{font-size:12px;color:#81C784;text-transform:uppercase;letter-spacing:4px}
.new-rec{color:#F5C518;font-size:14px;font-weight:800}
.hi{color:#81C784;font-size:12px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;padding:8px 120px 8px 14px;background:rgba(0,0,0,.45);border-bottom:1px solid rgba(255,255,255,.06)}
.hud-score{font-weight:800;font-size:17px;color:#F5C518}
.hud-info{font-size:11px;color:#81C784}
.hud-step{display:inline-block;color:#fff;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1px}
.hud-lives{display:flex;gap:3px;font-size:16px}
.life-off{opacity:.2}
.feedback{position:absolute;top:50px;left:50%;transform:translateX(-50%);z-index:200;background:rgba(0,0,0,.88);padding:7px 22px;border-radius:30px;font-size:15px;font-weight:800;border:2px solid;pointer-events:none;white-space:nowrap;animation:feedIn .25s ease}
@keyframes feedIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* CONVEYOR */
.conv-area{display:flex;flex-direction:column;justify-content:center;padding:20px 14px 14px;gap:20px}
.conv-track{position:relative;height:100px;background:linear-gradient(180deg,#2D3A30,#1F2923);border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.08)}
.conv-stripes{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.04) 40px,rgba(255,255,255,.04) 42px);animation:scrollS .8s linear infinite}
@keyframes scrollS{from{background-position:0 0}to{background-position:42px 0}}
.wi{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;user-select:none;padding:6px 10px;background:rgba(255,255,255,.1);border-radius:11px;border:1px solid rgba(255,255,255,.18);z-index:10;backdrop-filter:blur(4px);transition:box-shadow .15s}
.wi:hover{box-shadow:0 0 16px rgba(74,222,128,.3)}
.wi.sel{box-shadow:0 0 20px rgba(74,222,128,.6);border-color:#4ADE80}
.wi-e{font-size:28px;line-height:1}
.wi-n{font-size:9px;color:#C8E6C9;font-weight:700;text-align:center;max-width:78px;line-height:1.2}
.bins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bin{flex:1 1 120px;max-width:160px;min-height:90px;border-radius:15px;border:3px dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.bin:hover,.bin.over{transform:scale(1.06);box-shadow:0 0 20px rgba(255,255,255,.1)}
.bin-e{font-size:28px}.bin-l{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.combo{position:absolute;bottom:10px;right:16px;font-size:15px;font-weight:900;color:#F59E0B;text-shadow:0 0 12px rgba(245,158,11,.5);animation:pulse .6s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* QUIZ & REPAIR cards */
.card-area{display:flex;align-items:center;justify-content:center;padding:16px;min-height:460px}
.card{background:rgba(255,255,255,.05);border-radius:20px;padding:24px 20px;max-width:460px;width:100%;text-align:center;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.card.repair-border{border-color:rgba(245,158,11,.15)}
.card-tag{font-size:11px;text-transform:uppercase;letter-spacing:3px;margin-bottom:12px}
.card-emoji{font-size:50px}
.card-name{font-size:17px;font-weight:700;color:#E8F5E9;margin:6px 0 14px}
.card-problem{font-size:13px;color:#FCA5A5;margin-bottom:14px;font-style:italic}
.card-q{font-size:15px;font-weight:700;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:13px;padding:11px 15px;color:#E8F5E9;font-size:14px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;width:100%}
.opt:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
.opt.ok{background:rgba(16,185,129,.25);border-color:#10B981;color:#6EE7B7}
.opt.ko{background:rgba(239,68,68,.25);border-color:#EF4444;color:#FCA5A5}
.opt:disabled{cursor:default}
.card-fb{margin-top:12px;font-size:14px;font-weight:800}
.info-box{margin-top:12px;border-radius:12px;padding:10px 14px;text-align:left}
.info-box.green{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2)}
.info-box.orange{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2)}
.info-t{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.info-p{font-size:12px;line-height:1.4}

/* TRANSITION overlay */
.trans{position:absolute;inset:0;top:46px;z-index:100;background:rgba(13,23,16,.95);display:flex;align-items:center;justify-content:center;padding:20px}
.trans-card{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:400px}
.trans-emoji{font-size:60px}
.trans-title{font-size:24px;font-weight:900;color:#E8F5E9}
.trans-sub{font-size:14px;color:#A5D6A7;line-height:1.5}
.trans-score{font-size:16px;color:#F5C518;font-weight:800}

/* LEADERBOARD */
.lb{max-width:440px;width:100%;margin-top:4px}
.lb-t{font-size:14px;font-weight:800;color:#F5C518;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}
.lb table{width:100%;border-collapse:collapse}
.lb th{font-size:10px;color:#81C784;text-transform:uppercase;letter-spacing:1px;padding:4px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.lb td{font-size:13px;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.lb .rk{color:#F5C518;font-weight:800;width:30px}
.lb .nm{color:#E8F5E9;font-weight:700}
.lb .pt{color:#4ADE80;font-weight:800;text-align:right}
.lb .me{background:rgba(74,222,128,.08);border-radius:8px}

.hidden{display:none !important}

/* MODE TOGGLE */
.mode-row{display:flex;gap:8px;justify-content:center}
.mode-btn{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);color:#C8E6C9;padding:8px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.mode-btn:hover{border-color:#22D3EE;color:#22D3EE}
.mode-btn.sel{background:rgba(34,211,238,.15);border-color:#22D3EE;color:#67E8F9}

/* TRANSFORMATION VISUAL */
.transform{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0;padding:16px;background:rgba(255,255,255,.04);border-radius:16px;border:1px solid rgba(255,255,255,.06)}
.tf-before,.tf-after{display:flex;flex-direction:column;align-items:center;gap:4px}
.tf-emoji{font-size:44px;line-height:1}
.tf-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tf-arrow{font-size:28px;color:#4ADE80;animation:arrowPulse 1.2s ease infinite}
@keyframes arrowPulse{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(4px);opacity:1}}
.tf-after .tf-emoji{animation:popIn .5s ease}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* REPAIR VISUAL */
.repair-vis{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.rv-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.rv-emoji{font-size:48px;line-height:1}
.rv-broken{filter:grayscale(.4);opacity:.7}
.rv-fixed .rv-emoji{animation:sparkle .6s ease}
.rv-sparkle{font-size:24px;animation:sparkle .8s ease}
@keyframes sparkle{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
</style>
</head>
<body>
<div id="game">
<div class="lang-bar">
  <button class="lang-btn active" id="lb-fr">🇫🇷 FR</button>
  <button class="lang-btn" id="lb-en">🇬🇧 EN</button>
  <button class="lang-btn" id="lb-es">🇪🇸 ES</button>
</div>

<!-- START -->
<div id="s-start" class="scr">
  <p class="brand-line" id="u-assoc"></p>
  <div class="big-emoji">♻️</div>
  <h1 class="title">TRI & SECONDE VIE</h1>
  <p class="subtitle" id="u-subtitle"></p>
  <p class="brand-name">🏠 L'Oasis du Réemploi</p>
  <div class="rules-box">
    <p class="rule-item"><span class="tag tag-g">🚛 LE TRI</span> <span id="u-r1"></span></p>
    <p class="rule-item"><span class="tag tag-p">♻️ LE QUIZ</span> <span id="u-r2"></span></p>
    <p class="rule-item"><span class="tag tag-o">🔧 L'ATELIER</span> <span id="u-r3"></span></p>
    <p class="rule-item" id="u-r4"></p>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <p class="age-label" id="u-mode"></p>
    <div class="mode-row">
      <button class="mode-btn sel" id="mode-solo" data-m="solo">🧑 <span id="u-solo"></span></button>
      <button class="mode-btn" id="mode-team" data-m="team">👥 <span id="u-team"></span></button>
    </div>
  </div>
  <input type="text" class="name-input" id="inp-name" maxlength="25">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <p class="age-label" id="u-age"></p>
    <div class="age-row" id="age-row">
      <button class="age-btn" data-a="child">👶 6–10</button>
      <button class="age-btn" data-a="teen">🧑 11–15</button>
      <button class="age-btn" data-a="adult">🧑‍🦱 16+</button>
    </div>
  </div>
  <button class="btn btn-green" id="btn-go" disabled>▶ <span id="u-start"></span></button>
  <div id="lb-start" class="lb hidden"></div>
</div>

<!-- GAME -->
<div id="s-game" class="hidden">
  <div class="hud">
    <div style="display:flex;gap:12px;align-items:center">
      <span class="hud-score" id="h-score">⭐ 0</span>
      <span class="hud-info" id="h-round"></span>
      <span class="hud-info" id="h-player"></span>
    </div>
    <div style="flex:1;text-align:center"><span class="hud-step tag-g" id="h-step"></span></div>
    <div class="hud-lives" id="h-lives"></div>
  </div>
  <div id="fb" class="feedback hidden"></div>

  <!-- TRI -->
  <div id="p-tri" class="conv-area">
    <div class="conv-track" id="conv"><div class="conv-stripes"></div></div>
    <div class="bins" id="bins"></div>
    <div id="combo" class="combo hidden"></div>
  </div>

  <!-- QUIZ -->
  <div id="p-quiz" class="card-area hidden">
    <div class="card">
      <p class="card-tag" id="u-qprompt" style="color:#81C784"></p>
      <div class="card-emoji" id="q-emoji"></div>
      <div class="card-name" id="q-name"></div>
      <div id="q-transform" class="transform hidden"></div>
      <p class="card-q" id="u-qq" style="color:#A5D6A7"></p>
      <div class="opts" id="q-opts"></div>
      <p id="q-fb" class="card-fb hidden"></p>
      <div id="q-dyk" class="info-box green hidden"><p class="info-t" id="u-dykt" style="color:#4ADE80"></p><p class="info-p" id="q-dyk-p" style="color:#C8E6C9"></p></div>
    </div>
  </div>

  <!-- REPAIR -->
  <div id="p-repair" class="card-area hidden">
    <div class="card repair-border">
      <p class="card-tag" id="u-rprompt" style="color:#F59E0B"></p>
      <div class="repair-vis">
        <div class="rv-item rv-broken"><div class="rv-emoji" id="r-emoji"></div><span class="tf-label" style="color:#FCA5A5" id="r-state-before"></span></div>
      </div>
      <div class="card-name" id="r-name"></div>
      <div class="card-problem" id="r-prob"></div>
      <div id="r-after" class="repair-vis hidden"></div>
      <p class="card-q" id="u-rq" style="color:#FCD34D"></p>
      <div class="opts" id="r-opts"></div>
      <p id="r-fb" class="card-fb hidden"></p>
      <div id="r-tip" class="info-box orange hidden"><p class="info-t" id="u-ript" style="color:#F59E0B"></p><p class="info-p" id="r-tip-p" style="color:#FDE68A"></p></div>
    </div>
  </div>

  <!-- TRANSITION (overlay inside game) -->
  <div id="p-trans" class="trans hidden">
    <div class="trans-card">
      <div class="trans-emoji" id="tr-emoji"></div>
      <div class="trans-title" id="tr-title"></div>
      <div class="trans-sub" id="tr-sub"></div>
      <div class="trans-score" id="tr-score"></div>
      <button class="btn" id="tr-btn"></button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="s-over" class="scr hidden">
  <div class="big-emoji">🏁</div>
  <h1 class="title" style="font-size:24px" id="u-go"></h1>
  <div style="text-align:center"><div class="final-num" id="o-score"></div><div class="final-lbl">points</div></div>
  <p id="o-round" class="hi"></p>
  <p id="o-rec" class="new-rec hidden"></p>
  <p class="brand-name">🏠 L'Oasis du Réemploi — Friendly Upcycling</p>
  <div id="lb-over" class="lb"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-green btn-sm" id="btn-replay">🔄 <span id="u-replay"></span></button>
    <button class="btn-outline" id="btn-home">🏠 <span id="u-home"></span></button>
  </div>
</div>
</div>

  "🥫":"🛴","🥡":"🚲","🔧":"🚗","🧲":"🔗",
  "📰":"🧻","🍕":"👟","📚":"📦","🧃":"📝","✉️":"📒",
  "🍷":"🍷","🫙":"🧶","🍺":"🪟",
  "🥕":"🌱","🍵":"🌿","🥚":"🌾","🍌":"⚡","☕":"🍅"
};
/* Repair: after emoji (fixed state) */
const VIS_REPAIR={
  "🪑":"🪑","👖":"👖","📱":"📱","🚲":"🚲","💡":"💡",
  "🧸":"🧸","👟":"👟","🖥️":"🖥️","🎒":"🎒","🍳":"🍳",
  "🪞":"🪞","📻":"📻","🧥":"🧥","⌚":"⌚"
};

const D={child:{spd:.45,goal:12,qn:6,rn:4,acc:.03,hp:6},teen:{spd:.7,goal:16,qn:8,rn:6,acc:.06,hp:5},adult:{spd:.9,goal:16,qn:10,rn:8,acc:.1,hp:4}};
let age=null,pName="",hiBest=0;
function d(){return D[age]||D.teen}

/* ═══ STATE ═══ */
let S={},anim=null,lt=null,fbT=null,drag=null;
function reset(){S={scr:"start",sc:0,rnd:1,step:"tri",lives:d().hp,sorted:0,cmb:0,items:[],got:[],qQ:[],qI:0,rQ:[],rI:0}}

/* ═══ HELPERS ═══ */
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function el(id){return document.getElementById(id)}
function show(id){el(id).classList.remove("hidden")}
function hide(id){el(id).classList.add("hidden")}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

/* ═══ LEADERBOARD ═══ */
function getLB(){try{return JSON.parse(localStorage.getItem("oasis_lb")||"[]")}catch(e){return[]}}
function saveLB(n,s,a){const lb=getLB();lb.push({n:n,s:s,a:a,m:gameMode,d:Date.now()});lb.sort((a,b)=>b.s-a.s);if(lb.length>50)lb.length=50;localStorage.setItem("oasis_lb",JSON.stringify(lb))}
function drawLB(id){const lb=getLB(),c=el(id);if(!c)return;if(!lb.length){c.classList.add("hidden");return}c.classList.remove("hidden");const top=lb.slice(0,10);let h=`<p class="lb-t">${t("lbt")}</p><table><tr><th>${t("lbr")}</th><th>${t("lbn")}</th><th style="text-align:right">${t("lbs")}</th></tr>`;top.forEach((e,i)=>{const me=(e.n===pName)?"me":"";const icon=e.m==="team"?"👥 ":"";h+=`<tr class="${me}"><td class="rk">${i+1}</td><td class="nm">${icon}${esc(e.n)}</td><td class="pt">${e.s}</td></tr>`});h+=`</table>`;c.innerHTML=h}

/* ═══ UI REFRESH ═══ */
let gameMode="solo";
function refreshUI(){
  const s=(id,v)=>{const e=el(id);if(e)e.textContent=v};
  s("u-assoc",t("assoc"));s("u-subtitle",t("subtitle"));
  s("u-r1",t("r1"));s("u-r2",t("r2"));s("u-r3",t("r3"));s("u-r4",t("r4"));
  s("u-age",t("age"));s("u-start",t("start"));s("u-replay",t("replay"));s("u-home",t("home"));
  s("u-go",t("go"));s("u-qprompt",t("qp"));s("u-qq",t("qq"));s("u-dykt",t("dyk"));
  s("u-rprompt",t("rp"));s("u-rq",t("rq"));s("u-ript",t("rtip"));
  s("u-mode",t("mode"));s("u-solo",t("solo"));s("u-team",t("team"));
  el("inp-name").placeholder=gameMode==="team"?t("phTeam"):t("ph");
  drawLB("lb-start");
}

/* ═══ HUD ═══ */
function hud(){
  el("h-score").textContent="⭐ "+S.sc;
  el("h-round").textContent=t("round")+" "+S.rnd;
  el("h-player").textContent=(gameMode==="team"?"👥 ":"🧑 ")+pName;
  const lv=el("h-lives");lv.innerHTML="";
  for(let i=0;i<d().hp;i++){const s=document.createElement("span");s.textContent="❤️";if(i>=S.lives)s.classList.add("life-off");lv.appendChild(s)}
  const st=el("h-step");
  if(S.step==="tri"){st.className="hud-step tag-g";st.textContent=t("s1")+" ("+S.sorted+"/"+d().goal+")"}
  else if(S.step==="quiz"){st.className="hud-step tag-p";st.textContent=t("s2")+" ("+(S.qI+1)+"/"+S.qQ.length+")"}
  else if(S.step==="repair"){st.className="hud-step tag-o";st.textContent=t("s3")+" ("+(S.rI+1)+"/"+S.rQ.length+")"}
  else{st.className="hud-step tag-g";st.textContent=""}
}
function showFB(txt,col){clearTimeout(fbT);const e=el("fb");e.textContent=txt;e.style.color=col;e.style.borderColor=col;e.classList.remove("hidden");e.style.animation="none";e.offsetHeight;e.style.animation="";fbT=setTimeout(()=>hide("fb"),1200)}

/* ═══ BINS ═══ */
function mkBins(){
  const r=el("bins");r.innerHTML="";
  BINS.forEach(bin=>{
    const d=document.createElement("div");d.className="bin";
    d.style.borderColor=bin.color;d.style.background=bin.color+"18";
    d.innerHTML=`<span class="bin-e">${bin.emoji}</span><span class="bin-l" style="color:${bin.color}">${t("bins")[bin.id]}</span>`;
    d.addEventListener("dragover",ev=>{ev.preventDefault();d.classList.add("over")});
    d.addEventListener("dragleave",()=>d.classList.remove("over"));
    d.addEventListener("drop",ev=>{ev.preventDefault();d.classList.remove("over");doDrop(bin.id)});
    d.addEventListener("click",()=>doDrop(bin.id));
    r.appendChild(d);
  });
}

/* ═══ CONVEYOR ═══ */
function spawn(){
  const cv=el("conv");cv.querySelectorAll(".wi").forEach(e=>e.remove());
  const pool=shuf(W).slice(0,d().goal+3);
  S.items=pool.map((w,i)=>({...w,uid:S.rnd+"-"+i+"-"+Date.now(),x:-90-i*140,caught:false}));
  S.sorted=0;S.got=[];
  S.items.forEach(it=>{
    const e=document.createElement("div");e.className="wi";e.id="i-"+it.uid;e.draggable=true;
    e.innerHTML=`<span class="wi-e">${it.e}</span><span class="wi-n">${it.n[lang]||it.n.fr}</span>`;
    e.style.left=it.x+"px";
    e.addEventListener("dragstart",ev=>{drag=it.uid;e.classList.add("sel");ev.dataTransfer.setData("text/plain",it.uid)});
    e.addEventListener("dragend",()=>e.classList.remove("sel"));
    e.addEventListener("click",()=>{cv.querySelectorAll(".wi").forEach(w=>w.classList.remove("sel"));drag=it.uid;e.classList.add("sel")});
    cv.appendChild(e);
  });
}
function doDrop(binId){
  if(!drag||S.step!=="tri")return;
  const idx=S.items.findIndex(i=>i.uid===drag);
  if(idx<0||S.items[idx].caught){drag=null;return}
  const it=S.items[idx],bin=BINS.find(b=>b.id===binId),ok=bin.accepts.includes(it.b);
  it.caught=true;const e=document.getElementById("i-"+it.uid);if(e)e.remove();
  if(ok){
    S.cmb++;const bonus=S.cmb>=3?50:S.cmb>=2?25:0;const pts=100+bonus;
    S.sc+=pts;S.sorted++;S.got.push(it);
    showFB(S.cmb>=3?`🔥 ${t("cmb")} x${S.cmb} ! +${pts}`:`✅ ${t("bravo")} +${pts}`,"#10B981");
    updCombo();hud();
    if(S.sorted>=d().goal)setTimeout(()=>showTrans("t1","quiz"),500);
  }else{S.cmb=0;S.lives--;updCombo();hud();showFB("❌ "+t("wb"),"#EF4444");if(S.lives<=0)setTimeout(endGame,400)}
  drag=null;
}
function updCombo(){const e=el("combo");if(S.cmb>=2){e.textContent="🔥 "+t("cmb")+" x"+S.cmb;e.classList.remove("hidden")}else e.classList.add("hidden")}

/* ═══ GAME LOOP ═══ */
function loop(ts){
  if(!lt)lt=ts;const dt=(ts-lt)/1000;lt=ts;
  if(S.scr==="game"&&S.step==="tri"){
    const spd=(d().spd+(S.rnd-1)*d().acc)*60,tw=el("conv").offsetWidth||760;
    S.items.forEach(it=>{
      if(it.caught)return;it.x+=spd*dt;
      const e=document.getElementById("i-"+it.uid);if(e)e.style.left=it.x+"px";
      if(it.x>tw+20){it.caught=true;if(e)e.remove();S.cmb=0;S.lives--;updCombo();hud();showFB("💀 "+t("miss"),"#EF4444");if(S.lives<=0)setTimeout(endGame,400)}
    });
  }
  anim=requestAnimationFrame(loop);
}

/* ═══ TRANSITION ═══ */
let nextAction=null;
function showTrans(key,action){
  S.step="trans";
  hide("p-tri");hide("p-quiz");hide("p-repair");show("p-trans");
  const data=t(key);
  el("tr-emoji").textContent=data.e;
  el("tr-title").textContent=data.t;
  el("tr-sub").textContent=data.s;
  el("tr-score").textContent="⭐ "+S.sc+" pts";
  const btn=el("tr-btn");
  btn.textContent=data.b;
  btn.className="btn "+(action==="quiz"?"btn-purple":action==="repair"?"btn-orange":"btn-green");
  nextAction=action;
  hud();
}
function doTrans(){
  hide("p-trans");
  if(nextAction==="quiz")goQuiz();
  else if(nextAction==="repair")goRepair();
  else if(nextAction==="next")nextRound();
  nextAction=null;
}

/* ═══ QUIZ ═══ */
function goQuiz(){
  S.step="quiz";
  const pool=S.got.filter(i=>i.v);
  const sel=shuf(pool).slice(0,d().qn);
  if(!sel.length){showTrans("t2","repair");return}
  S.qQ=sel.map(it=>{const c=it.v[lang]||it.v.fr;const f=it.f[lang]||it.f.fr;return{it:it,opts:shuf([c,...shuf(f).slice(0,2)]),ans:c}});
  S.qI=0;hide("p-tri");hide("p-trans");show("p-quiz");drawQ();hud();
}
function drawQ(){
  const q=S.qQ[S.qI];
  el("q-emoji").textContent=q.it.e;el("q-name").textContent=q.it.n[lang]||q.it.n.fr;
  hide("q-fb");hide("q-dyk");hide("q-transform");
  const o=el("q-opts");o.innerHTML="";
  q.opts.forEach(op=>{const b=document.createElement("button");b.className="opt";b.textContent=op;b.addEventListener("click",function(){ansQ(op,q)});o.appendChild(b)});
}
function ansQ(a,q){
  const ok=a===q.ans;
  el("q-opts").querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.textContent===q.ans)b.classList.add("ok");if(b.textContent===a&&!ok)b.classList.add("ko")});
  const fb=el("q-fb");
  if(ok){S.sc+=200;fb.textContent="✅ "+t("ok")+" +200";fb.style.color="#10B981"}else{fb.textContent="❌ "+t("ko")+" "+q.ans;fb.style.color="#EF4444"}
  show("q-fb");hud();
  /* Show transformation visual */
  const re=VIS_QUIZ[q.it.e];
  if(re){
    const tv=el("q-transform");
    tv.innerHTML=`<div class="tf-before"><div class="tf-emoji">${q.it.e}</div><span class="tf-label" style="color:#81C784">${t("before")}</span></div><div class="tf-arrow">➜</div><div class="tf-after"><div class="tf-emoji">${re}</div><span class="tf-label" style="color:#4ADE80">${q.it.v[lang]||q.it.v.fr}</span></div>`;
    show("q-transform");
  }
  const dy=q.it.d[lang]||q.it.d.fr;
  if(dy){el("u-dykt").textContent=t("dyk");el("q-dyk-p").textContent=dy;show("q-dyk")}
  setTimeout(()=>{if(S.qI+1<S.qQ.length){S.qI++;drawQ();hud()}else showTrans("t2","repair")},4500);
}

/* ═══ REPAIR ═══ */
function goRepair(){
  S.step="repair";
  const sel=shuf(R).slice(0,d().rn);
  if(!sel.length){showTrans("t3","next");return}
  S.rQ=sel.map(it=>{const c=it.c[lang]||it.c.fr;const f=it.f[lang]||it.f.fr;return{it:it,opts:shuf([c,...f]),ans:c}});
  S.rI=0;hide("p-quiz");hide("p-trans");show("p-repair");drawR();hud();
}
function drawR(){
  const q=S.rQ[S.rI];
  el("r-emoji").textContent=q.it.e;el("r-name").textContent=q.it.n[lang]||q.it.n.fr;
  el("r-prob").textContent=q.it.p[lang]||q.it.p.fr;
  el("r-state-before").textContent=t("broken");
  hide("r-fb");hide("r-tip");hide("r-after");
  const o=el("r-opts");o.innerHTML="";
  q.opts.forEach(op=>{const b=document.createElement("button");b.className="opt";b.textContent=op;b.addEventListener("click",function(){ansR(op,q)});o.appendChild(b)});
}
function ansR(a,q){
  const ok=a===q.ans;
  el("r-opts").querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.textContent===q.ans)b.classList.add("ok");if(b.textContent===a&&!ok)b.classList.add("ko")});
  const fb=el("r-fb");
  if(ok){S.sc+=300;fb.textContent="🔧 "+t("rok")+" +300";fb.style.color="#F59E0B"}else{fb.textContent="❌ "+t("rko")+" "+q.ans;fb.style.color="#EF4444"}
  show("r-fb");hud();
  /* Show before → after repair visual */
  const av=el("r-after");
  av.innerHTML=`<div class="rv-item rv-broken"><div class="rv-emoji">${q.it.e}</div><span class="tf-label" style="color:#FCA5A5">${t("broken")}</span></div><div class="tf-arrow" style="color:#F59E0B">➜</div><div class="rv-item rv-fixed"><div class="rv-emoji">${q.it.e}</div><span class="rv-sparkle">✨</span><span class="tf-label" style="color:#4ADE80">${t("fixed")}</span></div>`;
  show("r-after");
  const tp=q.it.tip[lang]||q.it.tip.fr;
  if(tp){el("u-ript").textContent=t("rtip");el("r-tip-p").textContent=tp;show("r-tip")}
  setTimeout(()=>{if(S.rI+1<S.rQ.length){S.rI++;drawR();hud()}else showTrans("t3","next")},5000);
}

/* ═══ FLOW ═══ */
function nextRound(){S.rnd++;S.step="tri";S.qQ=[];S.qI=0;S.rQ=[];S.rI=0;hide("p-quiz");hide("p-repair");hide("p-trans");show("p-tri");spawn();hud()}
function startGame(){
  if(!age)return;
  pName=el("inp-name").value.trim()||"Joueur";
  reset();S.scr="game";
  hide("s-start");hide("s-over");show("s-game");show("p-tri");hide("p-quiz");hide("p-repair");hide("p-trans");
  mkBins();spawn();hud();updCombo();hide("fb");
  lt=null;if(anim)cancelAnimationFrame(anim);anim=requestAnimationFrame(loop);
}
function endGame(){
  S.scr="over";if(anim)cancelAnimationFrame(anim);hide("s-game");
  el("o-score").textContent=S.sc;
  el("o-round").textContent=t("rr")+" : "+S.rnd;
  saveLB(pName,S.sc,age);
  if(S.sc>hiBest){hiBest=S.sc;show("o-rec");el("o-rec").textContent=t("rec")}else hide("o-rec");
  show("s-over");drawLB("lb-over");
}
function goHome(){hide("s-over");hide("s-game");show("s-start");drawLB("lb-start")}

/* ═══ EVENT LISTENERS (all in one place) ═══ */
document.getElementById("lb-fr").addEventListener("click",function(){lang="fr";document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));this.classList.add("active");refreshUI()});
document.getElementById("lb-en").addEventListener("click",function(){lang="en";document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));this.classList.add("active");refreshUI()});
document.getElementById("lb-es").addEventListener("click",function(){lang="es";document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));this.classList.add("active");refreshUI()});

/* Mode toggle */
document.querySelectorAll(".mode-btn").forEach(function(b){
  b.addEventListener("click",function(){
    gameMode=this.dataset.m;
    document.querySelectorAll(".mode-btn").forEach(function(x){x.classList.remove("sel")});
    this.classList.add("sel");
    el("inp-name").placeholder=gameMode==="team"?t("phTeam"):t("ph");
    chkReady();
  });
});

document.querySelectorAll(".age-btn").forEach(function(b){
  b.addEventListener("click",function(){
    age=this.dataset.a;
    document.querySelectorAll(".age-btn").forEach(function(x){x.classList.remove("sel")});
    this.classList.add("sel");
    chkReady();
  });
});
el("inp-name").addEventListener("input",chkReady);
function chkReady(){el("btn-go").disabled=!(age&&el("inp-name").value.trim().length>=1)}

el("btn-go").addEventListener("click",startGame);
el("btn-replay").addEventListener("click",startGame);
el("btn-home").addEventListener("click",goHome);
el("tr-btn").addEventListener("click",doTrans);

/* ═══ INIT ═══ */
refreshUI();
</script>
</body>
</html>
